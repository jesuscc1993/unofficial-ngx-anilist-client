<mat-card class="composite compact">
  <div class="composite-header">
    <div class="header">
      <h2 class="text-100 bold no-margin flex-1">
        {{ mediaType.toLowerCase() + '.dashboard.recentlyUpdated' | translate }}
      </h2>

      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'generic.filter' | translate"
        [matTooltip]="'generic.filter' | translate"
        (click)="openFilters()"
      >
        <mt-icon name="filter"></mt-icon>
      </button>
    </div>
  </div>

  <div class="content no-padding-bottom">
    @if (!searching && filteredEntries?.length) {
      <mt-list-entries-grid
        [listEntries]="filteredEntries"
        [showListEntryStatus]="true"
        [showMediaStatus]="true"
      ></mt-list-entries-grid>
    } @else {
      <div class="placeholder">
        @if (searching) {
          <mat-spinner mode="indeterminate"></mat-spinner>
        } @else {
          <b>{{ 'generic.noResults' | translate }}</b>
        }
      </div>
    }

    @if (error) {
      <mt-alert type="error">
        {{ error }}
      </mt-alert>
    }
  </div>
</mat-card>
